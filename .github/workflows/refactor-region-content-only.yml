name: One-time regional fare cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-region-content-only.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neutralize regional fare copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/[slug]/[sido]/page.tsx';
          let s = fs.readFileSync(path, 'utf8');

          s = s.replace(
            "import { brandFareSummaries, baseFare, fareSpread, won } from '@/lib/fares';",
            "import { brandFareSummaries, won } from '@/lib/fares';",
          );
          s = s.replace("  const rivals = summaries.filter((s) => s.brand !== key);\n", '');

          const calcStart = s.indexOf('  // 이 지역에서 가장 싸게 보는 조합.');
          const calcEnd = s.indexOf('  // 지점이 적은 지역은 인접 지역을 크게 노출해 빈약한 페이지가 되지 않게 한다', calcStart);
          if (calcStart < 0 || calcEnd < 0) throw new Error('regional comparison calculation block not found');
          s = s.slice(0, calcStart) + s.slice(calcEnd);

          s = s.replace('<th scope="row">가장 흔한 금액</th>', '<th scope="row">대표 요금</th>');

          const morningBlock = `                {fare.morningLow != null && (\n                  <tr>\n                    <th scope="row">가장 싼 조조</th>\n                    <td colSpan={2}>{won(fare.morningLow)}</td>\n                  </tr>\n                )}\n`;
          if (!s.includes(morningBlock)) throw new Error('morning-low row not found');
          s = s.replace(morningBlock, '');

          const compareParagraphStart = s.indexOf('          <p style={{ marginTop: 14, color: \'var(--ink-soft)\' }}>');
          const compareParagraphEnd = s.indexOf('          </p>', compareParagraphStart);
          if (compareParagraphStart < 0 || compareParagraphEnd < 0) throw new Error('regional comparison paragraph not found');
          const neutralParagraph = `          <p style={{ marginTop: 14, color: 'var(--ink-soft)' }}>\n            지점별 실제 관람료는 상영관과 시간대에 따라 달라질 수 있습니다. 각 지점의 상세 요금은\n            지점 페이지에서 확인하고, 브랜드 간 비교는{' '}\n            <Link href={guidePath(GUIDES.fares)}>관람료 비교</Link>를 참고하세요.\n          </p>`;
          s = s.slice(0, compareParagraphStart) + neutralParagraph + s.slice(compareParagraphEnd + '          </p>'.length);

          const cheapestStart = s.indexOf('      {cheapestPlay && (');
          const screensStart = s.indexOf('      {screens.length > 0 && (', cheapestStart);
          if (cheapestStart < 0 || screensStart < 0) throw new Error('cheapest-play display block not found');
          s = s.slice(0, cheapestStart) + s.slice(screensStart);

          fs.writeFileSync(path, s);
          NODE

      - name: Verify cleanup
        run: |
          if grep -nE '가장 싼 조조|가장 싼 조합|보다.*쌉니다|const cheapestPlay|const cheapest =|const priciest =|const rivals =' 'app/[slug]/[sido]/page.tsx'; then
            echo 'regional price judgment still remains' >&2
            exit 1
          fi
          grep -n '대표 요금' 'app/[slug]/[sido]/page.tsx'

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/[slug]/[sido]/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m 'Neutralize price comparisons on regional pages'
          git push origin HEAD:main
