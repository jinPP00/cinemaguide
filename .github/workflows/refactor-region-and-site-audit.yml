name: One-time region cleanup and site audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-region-and-site-audit.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Neutralize regional fare copy
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'app/[slug]/[sido]/page.tsx';
          let s = fs.readFileSync(path, 'utf8');

          s = s.replace(
            "import { brandFareSummaries, baseFare, fareSpread, won } from '@/lib/fares';",
            "import { brandFareSummaries, won } from '@/lib/fares';",
          );
          s = s.replace("  const rivals = summaries.filter((s) => s.brand !== key);\n", '');

          const calcStart = s.indexOf('  // 이 지역에서 가장 싸게 보는 조합.');
          const calcEnd = s.indexOf('  // 지점이 적은 지역은 인접 지역을 크게 노출해 빈약한 페이지가 되지 않게 한다', calcStart);
          if (calcStart < 0 || calcEnd < 0) throw new Error('regional comparison calculation block not found');
          s = s.slice(0, calcStart) + s.slice(calcEnd);

          s = s.replace('<th scope="row">가장 흔한 금액</th>', '<th scope="row">대표 요금</th>');

          const morningBlock = `                {fare.morningLow != null && (\n                  <tr>\n                    <th scope="row">가장 싼 조조</th>\n                    <td colSpan={2}>{won(fare.morningLow)}</td>\n                  </tr>\n                )}\n`;
          if (!s.includes(morningBlock)) throw new Error('morning-low row not found');
          s = s.replace(morningBlock, '');

          const compareParagraphStart = s.indexOf('          <p style={{ marginTop: 14, color: \'var(--ink-soft)\' }}>');
          const compareParagraphEnd = s.indexOf('          </p>', compareParagraphStart);
          if (compareParagraphStart < 0 || compareParagraphEnd < 0) throw new Error('regional comparison paragraph not found');
          const neutralParagraph = `          <p style={{ marginTop: 14, color: 'var(--ink-soft)' }}>\n            지점별 실제 관람료는 상영관과 시간대에 따라 달라질 수 있습니다. 각 지점의 상세 요금은\n            지점 페이지에서 확인하고, 브랜드 간 비교는{' '}\n            <Link href={guidePath(GUIDES.fares)}>관람료 비교</Link>를 참고하세요.\n          </p>`;
          s = s.slice(0, compareParagraphStart) + neutralParagraph + s.slice(compareParagraphEnd + '          </p>'.length);

          const cheapestStart = s.indexOf('      {cheapestPlay && (');
          const screensStart = s.indexOf('      {screens.length > 0 && (', cheapestStart);
          if (cheapestStart < 0 || screensStart < 0) throw new Error('cheapest-play display block not found');
          s = s.slice(0, cheapestStart) + s.slice(screensStart);

          fs.writeFileSync(path, s);
          NODE

      - name: Add whole-site audit
        run: |
          cat > scripts/audit-site-pages.mjs <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';

          const OUT = 'out';
          if (!fs.existsSync(OUT)) {
            console.error('out/ 이 없습니다. 먼저 npm run build 를 실행하세요.');
            process.exit(1);
          }

          function walk(dir, acc = []) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(p, acc);
              else if (entry.name === 'index.html') acc.push(p);
            }
            return acc;
          }

          function decodeHtml(text) {
            let out = text;
            for (let i = 0; i < 3; i++) {
              out = out
                .replace(/&nbsp;|&#160;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/&quot;/gi, '"')
                .replace(/&#39;|&apos;/gi, "'")
                .replace(/&#(\d+);/g, (_m, n) => String.fromCodePoint(Number(n)))
                .replace(/&#x([0-9a-f]+);/gi, (_m, n) => String.fromCodePoint(parseInt(n, 16)));
            }
            return out;
          }

          function plain(html) {
            return decodeHtml(
              html
                .replace(/<!--[\s\S]*?-->/g, ' ')
                .replace(/<script[\s\S]*?<\/script>/gi, ' ')
                .replace(/<style[\s\S]*?<\/style>/gi, ' ')
                .replace(/<[^>]+>/g, ' '),
            ).replace(/\s+/g, ' ').trim();
          }

          function urlOf(file) {
            const rel = path.relative(OUT, file).split(path.sep).join('/').replace(/index\.html$/, '');
            return decodeURIComponent('/' + rel);
          }

          function attrs(tag) {
            const result = {};
            for (const m of tag.matchAll(/([:\w-]+)\s*=\s*["']([^"']*)["']/g)) result[m[1].toLowerCase()] = decodeHtml(m[2]);
            return result;
          }

          function metaContent(html, name) {
            for (const m of html.matchAll(/<meta\b[^>]*>/gi)) {
              const a = attrs(m[0]);
              if ((a.name ?? '').toLowerCase() === name.toLowerCase()) return a.content ?? '';
            }
            return '';
          }

          function canonical(html) {
            for (const m of html.matchAll(/<link\b[^>]*>/gi)) {
              const a = attrs(m[0]);
              if ((a.rel ?? '').toLowerCase().split(/\s+/).includes('canonical')) return a.href ?? '';
            }
            return '';
          }

          function normalizePath(value) {
            if (!value) return '';
            try {
              const u = new URL(value, 'https://cinemaguide.kr');
              let p = decodeURIComponent(u.pathname);
              if (!p.endsWith('/')) p += '/';
              return p;
            } catch {
              return value;
            }
          }

          const BRAND_SEGMENTS = new Set(['cgv', '롯데시네마', '메가박스']);
          const PRICE_JUDGMENT = /가장\s*싼|가장\s*비싼|더\s*쌉|더\s*비쌉|저렴(?:한|합니다|하게)?|비싼\s*(?:곳|지점|요금)|최저\s*지점|최고\s*지점/;
          const BOXOFFICE_MODULE = /현재\s*상영중인\s*영화\s*순위|박스오피스\s*TOP\s*10/i;
          const TRUST_LINKS = ['/about/', '/privacy/', '/terms/', '/contact/'];

          const issues = [];
          const warnings = [];
          const add = (url, kind, detail) => issues.push({ url, kind, detail });
          const warn = (url, kind, detail) => warnings.push({ url, kind, detail });

          const pages = walk(OUT).map((file) => {
            const html = fs.readFileSync(file, 'utf8');
            const url = urlOf(file);
            const text = plain(html);
            const title = decodeHtml(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1] ?? '').trim();
            const description = metaContent(html, 'description').trim();
            const canon = canonical(html).trim();
            const robots = metaContent(html, 'robots').toLowerCase();
            const noindex = robots.includes('noindex');
            return { file, html, url, text, title, description, canon, noindex };
          });

          const indexable = pages.filter((p) => !p.noindex);
          for (const p of indexable) {
            if (!p.title) add(p.url, 'title 누락', 'title이 없음');
            if (!p.description) add(p.url, 'description 누락', 'meta description이 없음');
            if (!p.canon) add(p.url, 'canonical 누락', 'canonical 링크가 없음');
            else if (normalizePath(p.canon) !== normalizePath(p.url)) add(p.url, 'canonical 불일치', `${p.canon} → ${p.url}`);

            const h1Count = (p.html.match(/<h1\b/gi) ?? []).length;
            if (h1Count !== 1) add(p.url, 'H1 개수 이상', `${h1Count}개`);
            if (/\bundefined\b|\bnull\b/.test(p.text)) add(p.url, '깨진 값 노출', 'undefined/null 문자열 노출');

            for (const href of TRUST_LINKS) {
              if (!p.html.includes(`href="${href}"`) && !p.html.includes(`href='${href}'`)) add(p.url, '신뢰 링크 누락', href);
            }

            if (p.url !== '/박스오피스/' && BOXOFFICE_MODULE.test(p.text)) {
              add(p.url, '박스오피스 모듈 잔존', '전용 페이지 밖에 순위 모듈 문구가 있음');
            }

            const parts = p.url.split('/').filter(Boolean);
            const isRegion = parts.length === 2 && BRAND_SEGMENTS.has(parts[0]);
            if (isRegion) {
              const m = p.text.match(PRICE_JUDGMENT);
              if (m) add(p.url, '지역 가격 평가 문구', m[0]);
            }

            if (p.text.length < 450 && !/^\/(privacy|terms|contact|disclaimer|affiliate-disclosure)\//.test(p.url)) {
              warn(p.url, '짧은 본문 후보', `${p.text.length}자`);
            }
          }

          function duplicates(field) {
            const map = new Map();
            for (const p of indexable) {
              const value = p[field];
              if (!value) continue;
              if (!map.has(value)) map.set(value, []);
              map.get(value).push(p.url);
            }
            return [...map.entries()].filter(([, urls]) => urls.length > 1);
          }

          for (const [title, urls] of duplicates('title')) warn(urls.join(', '), '중복 title', title);
          for (const [description, urls] of duplicates('description')) warn(urls.join(', '), '중복 description', description);

          console.log('\n=== 전체 사이트 정적 페이지 검사 ===');
          console.log(`전체 HTML: ${pages.length}개 · 색인 대상: ${indexable.length}개`);
          console.log(`오류: ${issues.length}건 · 검토 후보: ${warnings.length}건`);

          if (issues.length) {
            console.log('\n오류:');
            for (const x of issues.slice(0, 200)) console.log(`[${x.kind}] ${x.url} — ${x.detail}`);
          }
          if (warnings.length) {
            console.log('\n검토 후보(배포 차단 안 함):');
            for (const x of warnings.slice(0, 100)) console.log(`[${x.kind}] ${x.url} — ${x.detail}`);
          }

          if (issues.length > 0) process.exit(1);
          EOF

      - name: Add site audit to deploy workflow
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.github/workflows/deploy-cloudflare.yml';
          let s = fs.readFileSync(path, 'utf8');
          const needle = `      - name: Audit all branch detail pages\n        run: node scripts/audit-detail-pages.mjs\n`;
          const replacement = needle + `\n      - name: Audit whole static site\n        run: node scripts/audit-site-pages.mjs\n`;
          if (!s.includes(needle)) throw new Error('deploy audit anchor not found');
          if (!s.includes('Audit whole static site')) s = s.replace(needle, replacement);
          fs.writeFileSync(path, s);
          NODE

      - name: Verify cleanup
        run: |
          if grep -nE '가장 싼 조조|가장 싼 조합|보다.*쌉니다|const cheapestPlay|const cheapest =|const priciest =|const rivals =' 'app/[slug]/[sido]/page.tsx'; then
            echo 'regional price judgment still remains' >&2
            exit 1
          fi
          grep -n '대표 요금' 'app/[slug]/[sido]/page.tsx'
          grep -n 'Audit whole static site' .github/workflows/deploy-cloudflare.yml

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'app/[slug]/[sido]/page.tsx' scripts/audit-site-pages.mjs .github/workflows/deploy-cloudflare.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Neutralize regional fare copy and audit whole site'
          git push origin HEAD:main
