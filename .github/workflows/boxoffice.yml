name: 박스오피스 순위 갱신

# 매주 KOBIS 일별 박스오피스를 조회해 public/boxoffice.json을 갱신한다.
# 순위(영화 구성·순서)가 저장된 값과 같으면 fetch-boxoffice.mjs가 파일을 건드리지
# 않으므로, 이 워크플로도 실제로 바뀐 게 있을 때만 커밋·푸시한다.
# main에 푸시되면 Cloudflare가 저장소 연동을 통해 자동으로 재빌드·배포한다 —
# 여기서 Cloudflare API를 직접 호출하지 않는 이유.
#
# 러너에서 KOBIS 연결이 자주 타임아웃된다. 스크립트가 지수 백오프로 5회
# 재시도하고, 그래도 안 되면 기존 데이터를 유지한 채 exit 0으로 끝난다
# (주간 갱신이라 한 주 건너뛰어도 사이트는 정상). 반면 API 키 누락·오류 같은
# 설정 문제는 exit 1로 남겨 이 워크플로가 실패로 표시되게 한다.

on:
  schedule:
    # 매주 월요일 UTC 00:00 = KST 09:00
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-boxoffice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 박스오피스 데이터 조회
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          KMDB_API_KEY: ${{ secrets.KMDB_API_KEY }}
        run: node scripts/fetch-boxoffice.mjs

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/boxoffice.json; then
            echo "순위 변동 없음 — 커밋 생략"
          else
            git add public/boxoffice.json
            git commit -m "박스오피스 순위 자동 갱신 [skip ci]"
            git push
          fi
