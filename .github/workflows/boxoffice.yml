name: 박스오피스 순위 갱신

# 매주 KOBIS 일별 박스오피스를 조회해 public/boxoffice.json을 갱신한다.
# 집계일·관객 수·점유율까지 같으면 저장을 생략하고, 실제로 바뀔 때만 커밋한다.
# 배포는 deploy-cloudflare.yml이 담당한다(2026-08-14 확인: Cloudflare git 연동
# 자동배포는 없음 — 이 프로젝트는 wrangler deploy로만 배포됨).
#
# ⚠️ 여기서 GITHUB_TOKEN으로 push한 커밋은 push 이벤트로 다른 워크플로를
# 트리거하지 않는다(GitHub의 재귀 실행 방지 규칙). [skip ci]를 빼는 것만으로는
# 부족해서 2026-08-31·09-07·09-14 갱신분이 git에만 들어가고 라이브엔 3주간
# 반영되지 않았다(2026-09-15 확인). 그래서 push 뒤에 배포 워크플로를 직접
# workflow_dispatch로 호출한다 — API 호출은 GITHUB_TOKEN으로도 허용된다.
#
# 러너에서 KOBIS 연결이 자주 타임아웃된다. 스크립트가 지수 백오프로 5회
# 재시도하고, 그래도 안 되면 기존 데이터는 유지하되 실행을 실패로 표시한다.
# 갱신 장애가 초록색 성공 결과에 가려지지 않게 한다.

on:
  schedule:
    # 매주 월요일 UTC 00:00 = KST 09:00
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update-boxoffice:
    concurrency:
      group: boxoffice-update
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 박스오피스 데이터 조회
        env:
          KOBIS_API_KEY: ${{ secrets.KOBIS_API_KEY }}
          KMDB_API_KEY: ${{ secrets.KMDB_API_KEY }}
        run: node scripts/fetch-boxoffice.mjs

      - name: 변경사항 커밋 & 푸시
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/boxoffice.json; then
            echo "집계일·수치 변동 없음 — 커밋 생략"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git add public/boxoffice.json
            git commit -m "박스오피스 순위 자동 갱신"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 배포 워크플로 실행
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml --ref main
