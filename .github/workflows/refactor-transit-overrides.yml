name: One-time apply transit overrides

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-transit-overrides.yml'

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hook reviewed transit overrides
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'lib/transit-normalize.ts';
          let s = fs.readFileSync(path, 'utf8');

          const importNeedle = "import type { Branch } from './types';\n";
          if (!s.includes("from './transit-overrides'")) {
            if (!s.includes(importNeedle)) throw new Error('Branch import not found');
            s = s.replace(importNeedle, importNeedle + "import { reviewedTransitOverride } from './transit-overrides';\n");
          }

          const fnNeedle = "export function normalizeBranchTransit(branch: Branch): Branch {\n  const originalRaw = branch.transit.raw;";
          const fnReplacement = "export function normalizeBranchTransit(branch: Branch): Branch {\n  const override = reviewedTransitOverride(branch);\n  if (override) return { ...branch, transit: override };\n\n  const originalRaw = branch.transit.raw;";
          if (!s.includes('const override = reviewedTransitOverride(branch);')) {
            if (!s.includes(fnNeedle)) throw new Error('normalizeBranchTransit anchor not found');
            s = s.replace(fnNeedle, fnReplacement);
          }

          fs.writeFileSync(path, s);
          NODE

      - name: Verify hook
        run: grep -n 'reviewedTransitOverride' lib/transit-normalize.ts

      - name: Commit source refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/transit-normalize.ts
          git diff --cached --quiet && exit 0
          git commit -m 'Apply reviewed transit overrides before normalization'
          git push origin HEAD:main
